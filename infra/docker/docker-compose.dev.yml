services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rafraf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rafraf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafraf_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rafraf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rafraf}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rafraf-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
