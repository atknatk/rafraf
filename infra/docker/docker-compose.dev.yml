version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rafraf-postgres
    environment:
      POSTGRES_USER: rafraf
      POSTGRES_PASSWORD: rafraf_dev
      POSTGRES_DB: rafraf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafraf"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rafraf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
