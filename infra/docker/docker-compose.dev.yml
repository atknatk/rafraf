services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rafraf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rafraf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafraf_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rafraf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rafraf}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rafraf-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mem0:
    build:
      context: ./mem0
      dockerfile: Dockerfile
    container_name: rafraf-mem0
    environment:
      - MEM0_TELEMETRY=false
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-unused}
    ports:
      - "${MEM0_PORT:-8070}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
