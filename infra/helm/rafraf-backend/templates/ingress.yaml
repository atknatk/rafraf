{{- if .Values.ingress.enabled -}}
{{- /*
  ALB Controller treats `host: ""` as invalid → load balancer provision
  fails or attaches to the wrong host. Fail the render up-front when
  ingress is enabled but no host is configured. Per-env values files
  (values-staging.yaml, values-prod.yaml) MUST set ingress.host.
*/ -}}
{{- $host := required "ingress.host is required when ingress.enabled=true (set it in values-<env>.yaml)" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rafraf-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rafraf-backend.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if $host }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "rafraf-backend.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
