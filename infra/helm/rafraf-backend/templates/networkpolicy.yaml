{{- if and .Values.prodGuard .Values.prodGuard.enabled -}}
{{- include "rafraf-backend.validatePlaceholderCIDRs" . -}}
{{- end -}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rafraf-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rafraf-backend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rafraf-backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /*
      If `networkPolicy.ingress` is set, it OVERRIDES the structured form.
      Otherwise we render: ALB controller namespace + Prometheus namespace.
    */ -}}
    {{- if .Values.networkPolicy.ingress }}
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.albNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    # T3.5-polish-fix (HIGH #7): allow same-namespace helm test pod to reach
    # /ready. Without this rule the M5 smoke test would time out on any
    # cluster that actually enforces NetworkPolicy (Calico/Cilium).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
  egress:
    {{- /*
      If `networkPolicy.egress` is set, it OVERRIDES the structured form.
      Otherwise we render four scoped rules: RDS, Redis, DNS, External HTTPS.
    */ -}}
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    # RDS (PostgreSQL)
    - to:
        {{- range .Values.networkPolicy.rdsCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    # ElastiCache (Redis)
    - to:
        {{- range .Values.networkPolicy.redisCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6379
    # Cluster DNS — CoreDNS pods (any namespace) PLUS NodeLocal DNSCache
    # link-local IP. T3.5-polish-fix (HIGH #3): NodeLocal DNSCache is
    # host-networked at 169.254.20.10 and is NOT matched by namespaceSelector
    # alone; if the cluster enables it, name resolution would silently fail.
    # The ipBlock peer is harmless on clusters without NodeLocal.
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: {{ .Values.networkPolicy.nodeLocalDnsCacheCIDR | default "169.254.20.10/32" | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # External HTTPS (Anthropic API, AWS Secrets Manager VPC endpoint,
    # OTLP, GitHub, APNs). IMDS is always blocked to force IRSA.
    - to:
        {{- range .Values.networkPolicy.externalHTTPSCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- with $.Values.networkPolicy.externalHTTPSExcept }}
            except:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
