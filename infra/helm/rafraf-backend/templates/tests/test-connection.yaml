apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rafraf-backend.fullname" . }}-smoke-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rafraf-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl-ready
      image: curlimages/curl:8.5.0
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          SERVICE="{{ include "rafraf-backend.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
          # T3.5-polish (M5): hit /ready (DB + Redis + optional bridge)
          # rather than /health (process-up only). /ready is the true
          # signal that the pod is serving traffic; /health passes even
          # when DB is dead.
          echo "[smoke] GET http://$SERVICE/ready"
          curl -fsS --max-time 10 "http://$SERVICE/ready"
          echo
          echo "[smoke] GET http://$SERVICE/health (sanity)"
          curl -fsS --max-time 5 "http://$SERVICE/health"
          echo
          echo "[smoke] GET http://$SERVICE/metrics (header check)"
          curl -fsSI --max-time 5 "http://$SERVICE/metrics" | head -1
          echo "[smoke] OK"
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
