name: Auto Merge (Pipeline PRs)

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["Backend CI", "Agent CI", "iOS CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge
    runs-on: [self-hosted, rafraf-runner]
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'agent:pipeline'))
    steps:
      - name: Auto-merge pipeline PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Find open PRs with the agent:pipeline label
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 10,
            });

            const pipelinePRs = prs.filter(pr =>
              pr.labels.some(label => label.name === 'agent:pipeline')
            );

            for (const pr of pipelinePRs) {
              console.log(`Checking PR #${pr.number}: ${pr.title}`);

              // Get combined check status
              const { data: status } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              // Get check runs
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              const allCheckRuns = checkRuns.check_runs;
              const pendingChecks = allCheckRuns.filter(
                cr => cr.status !== 'completed'
              );
              const failedChecks = allCheckRuns.filter(
                cr => cr.status === 'completed' && cr.conclusion !== 'success' && cr.conclusion !== 'skipped'
              );

              console.log(`  Status: ${status.state}, Pending: ${pendingChecks.length}, Failed: ${failedChecks.length}`);

              if (pendingChecks.length > 0) {
                console.log(`  Skipping — ${pendingChecks.length} check(s) still pending`);
                continue;
              }

              if (failedChecks.length > 0) {
                console.log(`  Skipping — ${failedChecks.length} check(s) failed`);
                for (const fc of failedChecks) {
                  console.log(`    - ${fc.name}: ${fc.conclusion}`);
                }
                continue;
              }

              // All checks passed — attempt squash merge
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                });
                console.log(`  Merged PR #${pr.number} via squash merge`);
              } catch (error) {
                console.log(`  Failed to merge PR #${pr.number}: ${error.message}`);
              }
            }
