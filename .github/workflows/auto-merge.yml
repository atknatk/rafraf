name: Auto Merge

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["PR Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'check_suite' ||
      github.event_name == 'workflow_run'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto merge agent pipeline PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find open PRs with the "agent:pipeline" label targeting develop
          prs=$(gh pr list --label "agent:pipeline" --base develop --state open --json number --jq '.[].number')

          if [ -z "$prs" ]; then
            echo "No PRs with 'agent:pipeline' label found."
            exit 0
          fi

          for pr in $prs; do
            echo "Checking PR #$pr..."

            # Check if all required status checks have passed
            status=$(gh pr checks "$pr" --json state --jq '[.[] | select(.state != "SUCCESS" and .state != "SKIPPED")] | length')

            if [ "$status" -eq 0 ]; then
              echo "All checks passed for PR #$pr. Merging..."
              gh pr merge "$pr" --squash --delete-branch || echo "Failed to merge PR #$pr"
            else
              echo "PR #$pr has pending or failed checks. Skipping."
            fi
          done
