name: Agent CI

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
  workflow_call:

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check apps/agent/agent/

      - name: Run mypy
        run: mypy apps/agent/agent/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r apps/agent/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          cd apps/agent
          pytest --cov=agent --cov-report=xml --cov-fail-under=80
