name: Agent CI

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/agent

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check agent/

      - name: Ruff format check
        run: ruff format --check agent/

  typecheck:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: MyPy strict check
        run: mypy agent/

  test:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest --cov=agent --cov-report=term-missing
