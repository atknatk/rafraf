name: Backend Deploy

# Manual-only trigger (2026-05-02). The push-to-develop/main auto-trigger
# was removed for the same reason as ios-testflight.yml: ECR pushes —
# even though they're not a live K8s deploy — should be an explicit
# operator decision so image SHA tags align with intentional release
# cuts and `latest` doesn't drift on every backend commit.
#
# To deploy:
#   GitHub UI → Actions → "Backend Deploy" → "Run workflow"
#   (pick branch — develop for staging, main for prod)
#
# After the ECR push completes, ArgoCD picks up the new SHA tag if
# its image-updater is configured to track this repo, OR the operator
# manually `helm upgrade` / ArgoCD sync against the new tag per
# docs/runbooks/deploy.md.
on:
  workflow_dispatch:
    inputs:
      image_tag_override:
        description: "Override image tag (leave empty to use github.sha[:8])"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 827604626727.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: rafraf/backend

jobs:
  build-push:
    name: Build & Push to ECR
    runs-on: [self-hosted, rafraf-runner]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR
        run: |
          DOCKER_DIR="${RUNNER_TEMP}/docker-$$"
          mkdir -p "${DOCKER_DIR}"
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          AUTH=$(echo -n "AWS:${ECR_PASSWORD}" | base64)
          cat > "${DOCKER_DIR}/config.json" << EOCFG
          {
            "auths": {
              "${{ env.ECR_REGISTRY }}": {
                "auth": "${AUTH}"
              }
            }
          }
          EOCFG
          echo "DOCKER_DIR=${DOCKER_DIR}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          if [ -n "${{ inputs.image_tag_override }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag_override }}"
          else
            IMAGE_TAG="${GITHUB_SHA::8}"
          fi
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker --config "${DOCKER_DIR}" build \
            -t "${FULL_IMAGE}:${IMAGE_TAG}" \
            -t "${FULL_IMAGE}:latest" \
            .

          docker --config "${DOCKER_DIR}" push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker --config "${DOCKER_DIR}" push "${FULL_IMAGE}:latest"

          echo "Pushed ${FULL_IMAGE}:${IMAGE_TAG}"

      - name: Cleanup
        if: always()
        run: rm -rf "${DOCKER_DIR}"
