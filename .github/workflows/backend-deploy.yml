name: Backend Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 827604626727.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: rafraf/backend

jobs:
  build-push:
    name: Build & Push to ECR
    runs-on: [self-hosted, rafraf-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Use isolated Docker config to avoid macOS keychain issues
          export DOCKER_CONFIG="${RUNNER_TEMP}/.docker"
          mkdir -p "${DOCKER_CONFIG}"
          echo '{}' > "${DOCKER_CONFIG}/config.json"
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker build \
            -t "${FULL_IMAGE}:${IMAGE_TAG}" \
            -t "${FULL_IMAGE}:latest" \
            .

          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker push "${FULL_IMAGE}:latest"

          echo "Pushed ${FULL_IMAGE}:${IMAGE_TAG}"
