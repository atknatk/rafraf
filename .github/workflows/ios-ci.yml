name: iOS CI

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/ios/**"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/ios/**"
  workflow_call:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          cd apps/ios
          swiftlint

  build-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Build
        run: |
          xcodebuild build \
            -scheme RafRaf \
            -project apps/ios/RafRaf.xcodeproj \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme RafRaf \
            -project apps/ios/RafRaf.xcodeproj \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO
