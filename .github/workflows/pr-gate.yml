name: PR Gate

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: [self-hosted, rafraf-runner]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            ios:
              - 'apps/ios/**'

  backend-gate:
    name: Backend Gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, rafraf-runner]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: MyPy strict check
        run: mypy app/

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  ios-gate:
    name: iOS Gate
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: [self-hosted, rafraf-runner]
    defaults:
      run:
        working-directory: apps/ios
    env:
      SCHEME: RafRaf
      BUILD_DESTINATION: "generic/platform=iOS Simulator"
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -destination "$BUILD_DESTINATION"

      - name: Build
        run: |
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$BUILD_DESTINATION" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Determine test destination
        id: dest
        run: |
          RUNTIME=$(xcrun simctl list runtimes iOS -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['runtimes']
          available = [r for r in runtimes if r.get('isAvailable', False)]
          if available:
              print(available[-1]['identifier'])
          " 2>/dev/null || true)
          if [ -z "$RUNTIME" ]; then
            echo "dest=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
          else
            DEVICE=$(xcrun simctl list devices "$RUNTIME" -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in devices.items():
              for d in devs:
                  if d.get('isAvailable', False) and 'iPhone' in d['name']:
                      print(d['name']); sys.exit()
          print('iPhone 16')
          " 2>/dev/null || echo "iPhone 16")
            OS_VER=$(echo "$RUNTIME" | grep -oE '[0-9]+-[0-9]+$' | tr '-' '.')
            echo "dest=platform=iOS Simulator,name=$DEVICE,OS=$OS_VER" >> "$GITHUB_OUTPUT"
          fi
          echo "Test destination: $(cat "$GITHUB_OUTPUT")"

      - name: Test
        run: |
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "${{ steps.dest.outputs.dest }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  gate-result:
    name: PR Gate Result
    runs-on: [self-hosted, rafraf-runner]
    needs: [changes, backend-gate, ios-gate]
    if: always()
    steps:
      - name: Check gate results
        run: |
          echo "Backend changed: ${{ needs.changes.outputs.backend }}"
          echo "iOS changed: ${{ needs.changes.outputs.ios }}"

          FAILED=false

          if [ "${{ needs.changes.outputs.backend }}" == "true" ] && [ "${{ needs.backend-gate.result }}" != "success" ]; then
            echo "Backend gate FAILED"
            FAILED=true
          fi

          if [ "${{ needs.changes.outputs.ios }}" == "true" ] && [ "${{ needs.ios-gate.result }}" != "success" ]; then
            echo "iOS gate FAILED"
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo "One or more gates failed"
            exit 1
          fi

          echo "All applicable gates passed"
