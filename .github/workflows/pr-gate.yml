name: PR Gate

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      ios: ${{ steps.changes.outputs.ios }}
      agent: ${{ steps.changes.outputs.agent }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'shared/**'
            ios:
              - 'apps/ios/**'
            agent:
              - 'apps/agent/**'

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  backend-ci-skip:
    name: Backend CI (skipped)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "No backend changes detected, skipping."

  ios-ci:
    name: iOS CI
    needs: detect-changes
    if: needs.detect-changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios-ci.yml

  ios-ci-skip:
    name: iOS CI (skipped)
    needs: detect-changes
    if: needs.detect-changes.outputs.ios != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "No iOS changes detected, skipping."

  agent-ci:
    name: Agent CI
    needs: detect-changes
    if: needs.detect-changes.outputs.agent == 'true'
    uses: ./.github/workflows/agent-ci.yml

  agent-ci-skip:
    name: Agent CI (skipped)
    needs: detect-changes
    if: needs.detect-changes.outputs.agent != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "No agent changes detected, skipping."

  pr-gate-result:
    name: PR Gate Result
    if: always()
    needs: [backend-ci, backend-ci-skip, ios-ci, ios-ci-skip, agent-ci, agent-ci-skip]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate result
        run: |
          echo "Backend CI: ${{ needs.backend-ci.result }}"
          echo "Backend CI Skip: ${{ needs.backend-ci-skip.result }}"
          echo "iOS CI: ${{ needs.ios-ci.result }}"
          echo "iOS CI Skip: ${{ needs.ios-ci-skip.result }}"
          echo "Agent CI: ${{ needs.agent-ci.result }}"
          echo "Agent CI Skip: ${{ needs.agent-ci-skip.result }}"

          # Check if any non-skipped job failed
          if [[ "${{ needs.backend-ci.result }}" == "failure" || \
                "${{ needs.ios-ci.result }}" == "failure" || \
                "${{ needs.agent-ci.result }}" == "failure" ]]; then
            echo "One or more CI checks failed."
            exit 1
          fi

          echo "All CI checks passed or were skipped."
