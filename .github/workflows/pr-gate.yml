name: PR Gate

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            ios:
              - 'apps/ios/**'
            agent:
              - 'apps/agent/**'

  backend-gate:
    name: Backend Gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: MyPy strict check
        run: mypy app/

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  ios-gate:
    name: iOS Gate
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    env:
      SCHEME: RafRaf
      DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=18.2"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -destination "$DESTINATION"

      - name: Build
        run: |
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  agent-gate:
    name: Agent Gate
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check agent/

      - name: Ruff format check
        run: ruff format --check agent/

      - name: MyPy strict check
        run: mypy agent/

      - name: Run tests
        run: python -m pytest --cov=agent --cov-report=term-missing

  gate-result:
    name: PR Gate Result
    runs-on: ubuntu-latest
    needs: [changes, backend-gate, ios-gate, agent-gate]
    if: always()
    steps:
      - name: Check gate results
        run: |
          echo "Backend changed: ${{ needs.changes.outputs.backend }}"
          echo "iOS changed: ${{ needs.changes.outputs.ios }}"
          echo "Agent changed: ${{ needs.changes.outputs.agent }}"

          FAILED=false

          if [ "${{ needs.changes.outputs.backend }}" == "true" ] && [ "${{ needs.backend-gate.result }}" != "success" ]; then
            echo "Backend gate FAILED"
            FAILED=true
          fi

          if [ "${{ needs.changes.outputs.ios }}" == "true" ] && [ "${{ needs.ios-gate.result }}" != "success" ]; then
            echo "iOS gate FAILED"
            FAILED=true
          fi

          if [ "${{ needs.changes.outputs.agent }}" == "true" ] && [ "${{ needs.agent-gate.result }}" != "success" ]; then
            echo "Agent gate FAILED"
            FAILED=true
          fi

          if [ "$FAILED" == "true" ]; then
            echo "One or more gates failed"
            exit 1
          fi

          echo "All applicable gates passed"
