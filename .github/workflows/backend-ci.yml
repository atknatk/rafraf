name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: [self-hosted, rafraf-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check app/

      - name: Ruff format check
        run: |
          source .venv/bin/activate
          ruff format --check app/

  typecheck:
    name: Type Check (MyPy)
    runs-on: [self-hosted, rafraf-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: MyPy strict check
        run: |
          source .venv/bin/activate
          python3 -m mypy app/

  test:
    name: Test (Pytest)
    runs-on: [self-hosted, rafraf-runner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python3 -m pytest --cov=app --cov-report=term-missing
