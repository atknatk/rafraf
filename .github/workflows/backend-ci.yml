name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "shared/**"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/backend/**"
      - "shared/**"
  workflow_call:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check apps/backend/app/

      - name: Run mypy
        run: mypy apps/backend/app/

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rafraf
          POSTGRES_PASSWORD: rafraf_test
          POSTGRES_DB: rafraf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rafraf"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r apps/backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://rafraf:rafraf_test@localhost:5432/rafraf_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/backend
          pytest --cov=app --cov-report=xml --cov-fail-under=80
