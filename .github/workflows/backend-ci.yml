name: backend-ci

on:
  push:
    branches: [develop, main, "feature/**"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/backend/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rafraf
          POSTGRES_PASSWORD: rafraf
          POSTGRES_DB: rafraf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/pip install ruff mypy pytest pytest-asyncio pytest-cov pytest-timeout

      - name: ruff check
        working-directory: apps/backend
        run: .venv/bin/ruff check app/ tests/

      - name: ruff format check
        working-directory: apps/backend
        run: .venv/bin/ruff format --check app/

      - name: mypy strict
        working-directory: apps/backend
        run: .venv/bin/mypy app/

      - name: alembic upgrade
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://rafraf:rafraf@localhost:5432/rafraf
          REDIS_URL: redis://localhost:6379/0
        run: .venv/bin/python -m alembic upgrade head

      - name: pytest
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://rafraf:rafraf@localhost:5432/rafraf
          REDIS_URL: redis://localhost:6379/0
          JWT_PRIVATE_KEY_PATH: ./test_secrets/jwt_private.pem
          JWT_PUBLIC_KEY_PATH: ./test_secrets/jwt_public.pem
        run: |
          # Generate test JWT keypair (T2.9)
          mkdir -p test_secrets
          openssl genpkey -algorithm RSA -out test_secrets/jwt_private.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          openssl rsa -in test_secrets/jwt_private.pem -pubout -out test_secrets/jwt_public.pem 2>/dev/null
          .venv/bin/python -m pytest -q --cov=app --cov-report=term

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
