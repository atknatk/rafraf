name: Bug Report
description: Bug raporu
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Bug ile ilgili detayli aciklama
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Bug'i tekrarlamak icin adimlar
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Beklenen davranis
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Gerceklesen davranis
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - backend
        - ios
        - agent
        - infra
        - fullstack
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Ekran goruntuleri (opsiyonel)
    validations:
      required: false
