name: Feature Request
description: Yeni feature talebi
labels: ["feature"]
body:
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      placeholder: "F1-01"
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - F0
        - F1
        - F2
        - F3
        - F4
        - F5
        - F6
        - F7
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - backend
        - ios
        - agent
        - infra
        - fullstack
    validations:
      required: true

  - type: dropdown
    id: pipeline
    attributes:
      label: Pipeline
      options:
        - full
        - standard
        - quick
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Feature detaylari
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Kabul kriterleri
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "#1, #2"
    validations:
      required: false

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Teknik notlar (opsiyonel)
    validations:
      required: false
