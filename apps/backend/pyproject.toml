[project]
name = "rafraf-backend"
version = "0.1.0"
description = "RafRaf Backend - FastAPI WebSocket server + AI orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "anthropic>=0.42.0",
    "aioboto3>=13.0.0",
    "mem0ai>=0.1.0",
    "aioapns>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "COM", "C4", "PT", "RET", "SIM", "ARG"]
ignore = ["COM812"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
    "anthropic.*",
    "aioboto3.*",
    "aiobotocore.*",
    "botocore.*",
    "boto3.*",
    "mem0.*",
    "aioapns.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Disable anyio pytest plugin to avoid conflicts with pytest-asyncio.
# anyio is installed as a dependency of the anthropic SDK.
# Set per-test timeout to catch infinite hangs in CI.
addopts = "-p no:anyio --timeout=30"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
