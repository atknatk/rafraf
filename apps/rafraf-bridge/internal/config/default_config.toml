backend_url = "wss://api.rafraf.app/api/v1/agent/ws"
pairing_token = ""              # ilk kurulum, sonra api_token_path kullanılır
api_token_path = "~/.config/rafraf-bridge/token"
bridge_id = ""                  # backend tarafından atanır (ilk register sonrası)

claude_binary = "claude"
project_dir = "~/Code"
permission_mode = "acceptEdits"
agent_teams = true

heartbeat_interval = "15s"
reconnect_initial = "500ms"
reconnect_max = "30s"

# permission_timeout caps how long the PreToolUse broker waits on the
# iOS user's approval. The same value is stamped onto the outbound
# permission_request envelope so the iOS countdown + backend
# ApprovalService timeout track it end-to-end. Default 180s mirrors the
# backend's per-category default; valid range (0, 600s].
permission_timeout = "180s"

[storage_watcher]
enabled = true
projects_root = "~/.claude/projects"
max_file_age_days = 30

[statusline]
enabled = true
usage_path = "~/.claude/usage.json"
poll_every = "5s"
stale_after = "30m"

[telemetry]
expvar_enabled = true
expvar_addr = "127.0.0.1:9090"  # /debug/vars
log_level = "info"
log_file = "~/Library/Logs/rafraf-bridge/bridge.log"
