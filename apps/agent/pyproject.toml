[project]
name = "rafraf-agent"
version = "0.1.0"
description = "RafRaf Host Agent - Python asyncio daemon"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "docker>=7.1.0",
    "playwright>=1.49.0",
    "psutil>=6.1.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "COM", "C4", "PT", "RET", "SIM", "ARG"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
