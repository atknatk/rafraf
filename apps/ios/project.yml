name: RafRaf
options:
  bundleIdPrefix: app.rafraf
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  defaultConfig: Debug
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: "2.4.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"

targets:
  RafRaf:
    type: application
    platform: iOS
    sources:
      - path: RafRaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rafraf.RafRaf
        INFOPLIST_FILE: RafRaf/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: Factory
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI

  RafRafTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RafRafTests
    dependencies:
      - target: RafRaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rafraf.RafRafTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RafRaf.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RafRaf"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RafRaf:
    build:
      targets:
        RafRaf: all
        RafRafTests: [test]
    run:
      config: Debug
      simulateLocation: false
    test:
      config: Debug
      targets:
        - RafRafTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
